name: Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET Core 3.1
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 3.1.x

      - name: Restore
        run: dotnet restore HSL.sln

      - name: Build
        run: dotnet build HSL.sln --configuration Release --no-restore

      - name: Publish Windows executable
        if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Release')
        run: dotnet publish HSL/HSL.csproj --configuration Release --runtime win-x64 --self-contained true --no-restore --output publish

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Release')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -eq "refs/heads/main") {
            $tag = "v1.0.1"
          } else {
            $tag = "${{ github.ref_name }}"
          }

          gh release create $tag "publish/HSL.exe" --target "${{ github.sha }}" --title $tag --generate-notes
